<svg width="880" height="560" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- On-Premises container -->
  <rect x="30" y="60" width="260" height="220" rx="16" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1"/>
  <text x="160" y="85" text-anchor="middle" font-size="13" fill="#8A4B00" font-weight="bold">On-Premises</text>

  <rect x="55" y="100" width="210" height="50" rx="10" fill="#ffffff" stroke="#FB8C00" stroke-width="1"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#8A4B00" font-weight="bold">Customer Gateway</text>
  <text x="160" y="138" text-anchor="middle" font-size="9" fill="#8A4B00">firewall / router</text>

  <rect x="55" y="160" width="210" height="44" rx="10" fill="#ffffff" stroke="#FB8C00" stroke-width="1"/>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#8A4B00">Private IP range — 192.168.0.0/16</text>

  <rect x="55" y="214" width="210" height="44" rx="10" fill="#ffffff" stroke="#FB8C00" stroke-width="1"/>
  <text x="160" y="240" text-anchor="middle" font-size="10" fill="#8A4B00">BGP (dynamic routing)</text>

  <!-- VPN Tunnels -->
  <line x1="290" y1="130" x2="380" y2="130" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="120" text-anchor="middle" font-size="9" fill="#1F5C99">Tunnel 1</text>
  <line x1="290" y1="180" x2="380" y2="180" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="335" y="172" text-anchor="middle" font-size="9" fill="#1F5C99">Tunnel 2</text>
  <text x="335" y="200" text-anchor="middle" font-size="9" fill="#1F5C99">Site-to-Site IPsec VPN</text>
  <text x="335" y="212" text-anchor="middle" font-size="8" fill="#1F5C99">(dual tunnels)</text>

  <!-- AWS container -->
  <rect x="380" y="30" width="470" height="500" rx="16" fill="#DCEEFB" stroke="#4A90D9" stroke-width="1"/>
  <text x="615" y="55" text-anchor="middle" font-size="13" fill="#1F5C99" font-weight="bold">AWS</text>
  <text x="615" y="72" text-anchor="middle" font-size="10" fill="#1F5C99">Amazon VPC — 10.0.0.0/16</text>

  <!-- Transit Gateway -->
  <rect x="530" y="90" width="170" height="50" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="615" y="112" text-anchor="middle" font-size="11" fill="#5C1466" font-weight="bold">AWS Transit Gateway</text>
  <text x="615" y="128" text-anchor="middle" font-size="9" fill="#5C1466">central routing hub</text>

  <!-- Public subnet -->
  <rect x="410" y="160" width="200" height="90" rx="10" fill="#ffffff" stroke="#4A90D9" stroke-width="1"/>
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#1F5C99" font-weight="bold">Public Subnet</text>
  <text x="510" y="200" text-anchor="middle" font-size="9" fill="#1F5C99">Internet Gateway</text>
  <text x="510" y="215" text-anchor="middle" font-size="9" fill="#1F5C99">NAT Gateway</text>
  <text x="510" y="230" text-anchor="middle" font-size="9" fill="#1F5C99">multi-AZ</text>

  <!-- Private subnet -->
  <rect x="620" y="160" width="200" height="90" rx="10" fill="#E3F3DC" stroke="#6FAE4B" stroke-width="1"/>
  <text x="720" y="182" text-anchor="middle" font-size="11" fill="#3E6E2A" font-weight="bold">Private Subnet</text>
  <text x="720" y="200" text-anchor="middle" font-size="9" fill="#3E6E2A">Application workloads</text>
  <text x="720" y="215" text-anchor="middle" font-size="9" fill="#3E6E2A">Outbound via NAT GW</text>
  <text x="720" y="230" text-anchor="middle" font-size="9" fill="#3E6E2A">multi-AZ</text>

  <!-- Security layer -->
  <rect x="410" y="270" width="410" height="50" rx="10" fill="#F5F0FA" stroke="#8E24AA" stroke-width="1"/>
  <text x="615" y="290" text-anchor="middle" font-size="10" fill="#5C1466" font-weight="bold">Security Groups (stateful) + Network ACLs (stateless)</text>
  <text x="615" y="306" text-anchor="middle" font-size="9" fill="#5C1466">enforced at every tier</text>

  <!-- IAM -->
  <rect x="410" y="336" width="195" height="50" rx="10" fill="#F5F0FA" stroke="#8E24AA" stroke-width="1"/>
  <text x="507" y="356" text-anchor="middle" font-size="10" fill="#5C1466" font-weight="bold">IAM Roles &amp; Policies</text>
  <text x="507" y="372" text-anchor="middle" font-size="9" fill="#5C1466">least-privilege access</text>

  <!-- Flow Logs / CloudTrail -->
  <rect x="625" y="336" width="195" height="50" rx="10" fill="#F5F0FA" stroke="#8E24AA" stroke-width="1"/>
  <text x="722" y="352" text-anchor="middle" font-size="10" fill="#5C1466" font-weight="bold">VPC Flow Logs</text>
  <text x="722" y="368" text-anchor="middle" font-size="9" fill="#5C1466">+ CloudTrail (API audit)</text>

  <text x="615" y="418" text-anchor="middle" font-size="10" fill="#777777">Public and private subnets span multiple AZs for high availability</text>
  <text x="615" y="436" text-anchor="middle" font-size="9" fill="#777777">All hybrid traffic routes through Transit Gateway — no direct VPC-to-VPC peering</text>

  <!-- Connections -->
  <line x1="615" y1="140" x2="615" y2="160" stroke="#8E24AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="250" x2="615" y2="270" stroke="#4A90D9" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="380" y1="130" x2="530" y2="115" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
