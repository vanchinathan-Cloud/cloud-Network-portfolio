<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>

  <rect x="330" y="15" width="140" height="40" rx="8" fill="#ECECEC" stroke="#888888" stroke-width="1"/>
  <text x="400" y="40" text-anchor="middle" font-size="13" fill="#333333">Internet</text>
  <line x1="400" y1="55" x2="400" y2="85" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="310" y="85" width="180" height="40" rx="8" fill="#ECECEC" stroke="#888888" stroke-width="1"/>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#333333">Internet Gateway</text>

  <rect x="40" y="140" width="720" height="400" rx="16" fill="#FAFAFA" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="163" font-size="13" fill="#444444" font-weight="bold">VPC — 10.0.0.0/16 (2 AZs for redundancy)</text>

  <line x1="400" y1="125" x2="400" y2="180" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="180" width="320" height="330" rx="14" fill="#F5F5F5" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="85" y="202" font-size="12" fill="#555555" font-weight="bold">Availability Zone A</text>

  <rect x="90" y="215" width="280" height="115" rx="10" fill="#DCEEFB" stroke="#4A90D9" stroke-width="1"/>
  <text x="105" y="235" font-size="12" fill="#1F5C99" font-weight="bold">Public Subnet 10.0.0.0/24</text>
  <rect x="110" y="250" width="130" height="36" rx="7" fill="#ffffff" stroke="#4A90D9" stroke-width="1"/>
  <text x="175" y="266" text-anchor="middle" font-size="11" fill="#1F5C99">NAT Gateway</text>
  <text x="175" y="280" text-anchor="middle" font-size="8" fill="#1F5C99">+ Elastic IP</text>
  <rect x="250" y="250" width="100" height="36" rx="7" fill="#ffffff" stroke="#4A90D9" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-size="10" fill="#1F5C99">Test EC2</text>
  <text x="105" y="315" font-size="10" fill="#1F5C99">rt-public-a: 0.0.0.0/0 → IGW</text>

  <line x1="175" y1="286" x2="175" y2="345" stroke="#6FAE4B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="345" width="280" height="140" rx="10" fill="#E3F3DC" stroke="#6FAE4B" stroke-width="1"/>
  <text x="105" y="365" font-size="12" fill="#3E6E2A" font-weight="bold">Private Subnet 10.0.10.0/24</text>
  <rect x="110" y="380" width="130" height="36" rx="7" fill="#ffffff" stroke="#6FAE4B" stroke-width="1"/>
  <text x="175" y="402" text-anchor="middle" font-size="10" fill="#3E6E2A">EC2 (no public IP)</text>
  <text x="105" y="440" font-size="10" fill="#3E6E2A">rt-private-a: 0.0.0.0/0 → NAT GW</text>
  <text x="105" y="460" font-size="9" fill="#3E6E2A">SG: no inbound from internet</text>

  <rect x="410" y="180" width="320" height="330" rx="14" fill="#F5F5F5" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="425" y="202" font-size="12" fill="#555555" font-weight="bold">Availability Zone B</text>

  <rect x="430" y="215" width="280" height="115" rx="10" fill="#DCEEFB" stroke="#4A90D9" stroke-width="1"/>
  <text x="445" y="235" font-size="12" fill="#1F5C99" font-weight="bold">Public Subnet 10.0.1.0/24</text>
  <rect x="450" y="250" width="130" height="36" rx="7" fill="#ffffff" stroke="#4A90D9" stroke-width="1"/>
  <text x="515" y="266" text-anchor="middle" font-size="11" fill="#1F5C99">NAT Gateway</text>
  <text x="515" y="280" text-anchor="middle" font-size="8" fill="#1F5C99">+ Elastic IP</text>
  <text x="445" y="315" font-size="10" fill="#1F5C99">rt-public-b: 0.0.0.0/0 → IGW</text>

  <line x1="515" y1="286" x2="515" y2="345" stroke="#6FAE4B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="345" width="280" height="140" rx="10" fill="#E3F3DC" stroke="#6FAE4B" stroke-width="1"/>
  <text x="445" y="365" font-size="12" fill="#3E6E2A" font-weight="bold">Private Subnet 10.0.11.0/24</text>
  <rect x="450" y="380" width="130" height="36" rx="7" fill="#ffffff" stroke="#6FAE4B" stroke-width="1"/>
  <text x="515" y="402" text-anchor="middle" font-size="10" fill="#3E6E2A">EC2 (no public IP)</text>
  <text x="445" y="440" font-size="10" fill="#3E6E2A">rt-private-b: 0.0.0.0/0 → NAT GW</text>
  <text x="445" y="460" font-size="9" fill="#3E6E2A">SG: no inbound from internet</text>

  <text x="58" y="555" font-size="9" fill="#777777">NACL (subnet-level, stateless — default allow-all) sits in front of every subnet shown above</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
