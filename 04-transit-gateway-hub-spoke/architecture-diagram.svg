<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Transit Gateway (hub) -->
  <rect x="320" y="200" width="160" height="80" rx="14" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" font-size="14" fill="#5C1466" font-weight="bold">Transit Gateway</text>
  <text x="400" y="255" text-anchor="middle" font-size="11" fill="#5C1466">Route table per attachment</text>

  <!-- Spoke VPC A -->
  <rect x="60" y="40" width="200" height="100" rx="12" fill="#DCEEFB" stroke="#4A90D9" stroke-width="1"/>
  <text x="160" y="70" text-anchor="middle" font-size="13" fill="#1F5C99" font-weight="bold">VPC A</text>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#1F5C99">10.0.0.0/16</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#1F5C99">Prod workloads</text>

  <!-- Spoke VPC B -->
  <rect x="540" y="40" width="200" height="100" rx="12" fill="#E3F3DC" stroke="#6FAE4B" stroke-width="1"/>
  <text x="640" y="70" text-anchor="middle" font-size="13" fill="#3E6E2A" font-weight="bold">VPC B</text>
  <text x="640" y="90" text-anchor="middle" font-size="11" fill="#3E6E2A">10.1.0.0/16</text>
  <text x="640" y="108" text-anchor="middle" font-size="11" fill="#3E6E2A">Shared services</text>

  <!-- Spoke VPC C -->
  <rect x="300" y="380" width="200" height="80" rx="12" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1"/>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#8A4B00" font-weight="bold">VPC C</text>
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#8A4B00">10.2.0.0/16 — Dev</text>

  <!-- Connections -->
  <line x1="220" y1="140" x2="360" y2="210" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="140" x2="440" y2="210" stroke="#6FAE4B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="400" y2="380" stroke="#FB8C00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="800" y="470" text-anchor="end" font-size="10" fill="#777777">Each VPC attaches to TGW; route tables control association / propagation</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
