<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .layer-box { fill: #e8f4f8; stroke: #1f77b4; stroke-width: 2; }
      .layer-title { font-size: 14px; font-weight: bold; fill: #1f77b4; }
      .layer-desc { font-size: 12px; fill: #333; }
      .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
      .title-text { font-size: 18px; font-weight: bold; fill: #000; }
      .label { font-size: 11px; fill: #555; }
      .internet { fill: #fff3cd; stroke: #ff9800; stroke-width: 2; }
      .dns { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
      .cdn { fill: #cce5ff; stroke: #0066cc; stroke-width: 2; }
      .alb { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
      .vpc { fill: #e2e3e5; stroke: #6c757d; stroke-width: 2; }
      .security { fill: #ffeaa7; stroke: #fdcb6e; stroke-width: 2; }
      .compute { fill: #dfe6e9; stroke: #2d3436; stroke-width: 2; }
      .database { fill: #fab1a0; stroke: #e17055; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title-text">AWS Traffic Flow - 11 Layers</text>
  
  <!-- Layer 1: Internet/User -->
  <rect x="350" y="50" width="300" height="60" class="internet" rx="5"/>
  <text x="500" y="75" text-anchor="middle" class="layer-title">1. INTERNET (User)</text>
  <text x="500" y="95" text-anchor="middle" class="label">Browser Request: https://app.example.com/api/data</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="110" x2="500" y2="140" class="arrow"/>
  
  <!-- Layer 2: DNS (Route 53) -->
  <rect x="300" y="140" width="400" height="80" class="dns" rx="5"/>
  <text x="500" y="165" text-anchor="middle" class="layer-title">2. DNS Resolution (Route 53)</text>
  <text x="500" y="185" text-anchor="middle" class="label">Resolves: app.example.com → 203.0.113.1 (CloudFront IP)</text>
  <text x="500" y="205" text-anchor="middle" class="label">Health checks, failover routing</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="220" x2="500" y2="250" class="arrow"/>
  
  <!-- Layer 3: CloudFront + WAF -->
  <rect x="250" y="250" width="500" height="100" class="cdn" rx="5"/>
  <text x="500" y="275" text-anchor="middle" class="layer-title">3. CloudFront Edge + WAF</text>
  <text x="500" y="295" text-anchor="middle" class="label">Global CDN distribution, cache check (TTL: 0 for APIs)</text>
  <text x="500" y="315" text-anchor="middle" class="label">WAF: rate limiting, DDoS protection, geo-blocking</text>
  <text x="500" y="335" text-anchor="middle" class="label">Forward to origin: my-alb-123456789.us-east-1.elb.amazonaws.com</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="350" x2="500" y2="380" class="arrow"/>
  
  <!-- Layer 4: ALB TLS Termination -->
  <rect x="250" y="380" width="500" height="90" class="alb" rx="5"/>
  <text x="500" y="405" text-anchor="middle" class="layer-title">4. Application Load Balancer (ALB)</text>
  <text x="500" y="425" text-anchor="middle" class="label">TLS/SSL termination on port 443</text>
  <text x="500" y="445" text-anchor="middle" class="label">Listener rules: host/path based routing to target group</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="470" x2="500" y2="500" class="arrow"/>
  
  <!-- Layer 5: VPC Boundary -->
  <rect x="200" y="500" width="600" height="70" class="vpc" rx="5"/>
  <text x="500" y="525" text-anchor="middle" class="layer-title">5. VPC Routing Decision</text>
  <text x="500" y="545" text-anchor="middle" class="label">Public subnet (ALB here) → Route table: 0.0.0.0/0 → IGW</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="570" x2="500" y2="600" class="arrow"/>
  
  <!-- Layer 6: Security Groups (ALB) -->
  <rect x="200" y="600" width="600" height="70" class="security" rx="5"/>
  <text x="500" y="625" text-anchor="middle" class="layer-title">6. ALB Security Group (Stateful Firewall)</text>
  <text x="500" y="645" text-anchor="middle" class="label">Inbound: TCP 80, 443 from 0.0.0.0/0 ✓ ALLOW</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="670" x2="500" y2="700" class="arrow"/>
  
  <!-- Layer 7: Target Selection -->
  <rect x="250" y="700" width="500" height="80" class="alb" rx="5"/>
  <text x="500" y="725" text-anchor="middle" class="layer-title">7. Target Group Selection</text>
  <text x="500" y="745" text-anchor="middle" class="label">Healthy targets (health check: HTTP /health)</text>
  <text x="500" y="765" text-anchor="middle" class="label">Round-robin: i-app-1 (10.0.2.10:8080) → Forward request</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="780" x2="500" y2="810" class="arrow"/>
  
  <!-- Layer 8: App Security Group -->
  <rect x="200" y="810" width="600" height="70" class="security" rx="5"/>
  <text x="500" y="835" text-anchor="middle" class="layer-title">8. App Server Security Group</text>
  <text x="500" y="855" text-anchor="middle" class="label">Inbound: TCP 8080 from sg-alb only ✓ ALLOW</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="880" x2="500" y2="910" class="arrow"/>
  
  <!-- Layer 9: Application Processing -->
  <rect x="200" y="910" width="600" height="80" class="compute" rx="5"/>
  <text x="500" y="935" text-anchor="middle" class="layer-title">9. Application Processing</text>
  <text x="500" y="955" text-anchor="middle" class="label">App (EKS/ECS) receives HTTP on :8080</text>
  <text x="500" y="975" text-anchor="middle" class="label">Process business logic → Query database</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="990" x2="500" y2="1020" class="arrow"/>
  
  <!-- Layer 10: Database Access -->
  <rect x="250" y="1020" width="500" height="80" class="database" rx="5"/>
  <text x="500" y="1045" text-anchor="middle" class="layer-title">10. RDS Database (TCP 3306)</text>
  <text x="500" y="1065" text-anchor="middle" class="label">App initiates connection to RDS</text>
  <text x="500" y="1085" text-anchor="middle" class="label">RDS SG allows: TCP 3306 from sg-app ✓ ALLOW</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="1100" x2="500" y2="1130" class="arrow"/>
  
  <!-- Layer 11: Response -->
  <rect x="300" y="1130" width="400" height="60" class="internet" rx="5"/>
  <text x="500" y="1155" text-anchor="middle" class="layer-title">11. Response Path (Reverse)</text>
  <text x="500" y="1175" text-anchor="middle" class="label">Response → App → ALB → CloudFront → User</text>
  
  <!-- Legend on the right -->
  <text x="850" y="140" class="title-text" font-size="14">Legend:</text>
  
  <rect x="800" y="160" width="180" height="20" class="internet" rx="3"/>
  <text x="810" y="175" class="label">Internet/Edge</text>
  
  <rect x="800" y="190" width="180" height="20" class="dns" rx="3"/>
  <text x="810" y="205" class="label">DNS/Routing</text>
  
  <rect x="800" y="220" width="180" height="20" class="cdn" rx="3"/>
  <text x="810" y="235" class="label">CDN/Security</text>
  
  <rect x="800" y="250" width="180" height="20" class="alb" rx="3"/>
  <text x="810" y="265" class="label">Load Balancer</text>
  
  <rect x="800" y="280" width="180" height="20" class="security" rx="3"/>
  <text x="810" y="295" class="label">Security/Access</text>
  
  <rect x="800" y="310" width="180" height="20" class="compute" rx="3"/>
  <text x="810" y="325" class="label">Compute/App</text>
  
  <rect x="800" y="340" width="180" height="20" class="database" rx="3"/>
  <text x="810" y="355" class="label">Database</text>
</svg>
