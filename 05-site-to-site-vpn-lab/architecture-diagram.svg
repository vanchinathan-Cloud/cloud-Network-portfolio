<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="360" fill="#ffffff"/>

  <!-- On-prem simulator -->
  <rect x="40" y="130" width="220" height="100" rx="12" fill="#FBE9E7" stroke="#D84315" stroke-width="1"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" fill="#8C2A0F" font-weight="bold">On-Prem (simulated)</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#8C2A0F">EC2 + strongSwan</text>
  <text x="150" y="198" text-anchor="middle" font-size="11" fill="#8C2A0F">Customer Gateway (CGW)</text>

  <!-- Tunnel 1 -->
  <line x1="260" y1="160" x2="440" y2="160" stroke="#D84315" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="#8C2A0F">Tunnel 1 (IPsec)</text>

  <!-- Tunnel 2 -->
  <line x1="260" y1="200" x2="440" y2="200" stroke="#D84315" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="350" y="215" text-anchor="middle" font-size="10" fill="#8C2A0F">Tunnel 2 (standby/HA)</text>

  <!-- VGW / TGW -->
  <rect x="440" y="130" width="180" height="100" rx="12" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1"/>
  <text x="530" y="160" text-anchor="middle" font-size="13" fill="#5C1466" font-weight="bold">VGW / TGW</text>
  <text x="530" y="180" text-anchor="middle" font-size="11" fill="#5C1466">VPN termination</text>
  <text x="530" y="198" text-anchor="middle" font-size="11" fill="#5C1466">Static or BGP routing</text>

  <line x1="620" y1="180" x2="680" y2="180" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC -->
  <rect x="680" y="130" width="90" height="100" rx="12" fill="#E3F3DC" stroke="#6FAE4B" stroke-width="1"/>
  <text x="725" y="180" text-anchor="middle" font-size="12" fill="#3E6E2A">VPC</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
